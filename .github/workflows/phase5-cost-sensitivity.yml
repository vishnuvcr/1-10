name: Phase 5 Cost Sensitivity

on:
  push:
    branches:
      - phase-5-cost-sensitivity
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run fixed cost grid on frozen maximum-history data
        run: python scripts/run_cost_sensitivity.py
      - run: cat results/cost_sensitivity.csv
      - name: Freeze sensitivity results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/cost_sensitivity.csv results/cost_sensitivity_baseline_vs_stress.csv
          git commit -m "research: freeze cost sensitivity results [skip ci]" || exit 0
          git push
