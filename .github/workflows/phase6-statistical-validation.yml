name: Phase 6 Statistical Validation

on:
  push:
    branches:
      - phase-6-statistical-validation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/statistical_validation.py
      - run: cat results/statistical_validation.csv
      - name: Freeze statistical results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/statistical_validation.csv results/statistical_validation.json results/statistical_validation_pooled.json
          git commit -m "research: freeze statistical validation [skip ci]" || exit 0
          git push
