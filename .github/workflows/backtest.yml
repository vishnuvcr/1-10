name: Daily Mean-Reversion Backtest

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Yahoo Finance ticker
        required: true
        default: ^NSEI
      start:
        description: Start date YYYY-MM-DD
        required: true
        default: 2010-01-01
      end:
        description: End date YYYY-MM-DD, blank for latest
        required: false
        default: ''
      monte_carlo:
        description: Monte Carlo paths
        required: true
        default: '1000'
      seed:
        description: RNG seed
        required: true
        default: '42'
      refresh_data:
        description: Replace the local data cache
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: yfinance-${{ inputs.ticker }}-${{ inputs.start }}-${{ inputs.end }}
          restore-keys: yfinance-${{ inputs.ticker }}-
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Run backtest
        env:
          MPLBACKEND: Agg
        run: |
          EXTRA=''
          if [ "${{ inputs.refresh_data }}" = 'true' ]; then EXTRA='--refresh-data'; fi
          python backtest.py --ticker "${{ inputs.ticker }}" --start "${{ inputs.start }}" ${EXTRA} --n-mc "${{ inputs.monte_carlo }}" --seed "${{ inputs.seed }}" --output-dir results
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            results/
            data/raw/
