name: Daily Mean-Reversion Backtest
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Yahoo Finance ticker
        required: true
        default: ^NSEI
      start:
        description: Start date YYYY-MM-DD
        required: true
        default: 2010-01-01
      end:
        description: End date YYYY-MM-DD, blank for latest
        required: false
        default: ''
      monte_carlo:
        description: Monte Carlo paths
        required: true
        default: '1000'
      seed:
        description: RNG seed
        required: true
        default: '42'
      refresh_data:
        description: Replace the local data cache
        required: true
        default: false
        type: boolean
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
