name: Phase 3 Historical Coverage Diagnostic

on:
  push:
    branches:
      - phase-3-history-extension

permissions:
  contents: write

jobs:
  history-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - uses: actions/cache@v4
        with:
          path: data/raw
          key: phase3-history-yf-1990-2026
          restore-keys: |
            phase3-history-yf-

      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

      - name: Run unchanged rule on maximum-coverage sample
        env:
          MPLBACKEND: Agg
        shell: bash
        run: |
          mkdir -p results/history_extension
          for ticker in "^NSEI" "RELIANCE.NS" "HDFCBANK.NS" "ICICIBANK.NS" "INFY.NS" "TCS.NS" "SBIN.NS"; do
            slug="$(echo "$ticker" | tr -cd '[:alnum:]._-')"
            mkdir -p "results/history_extension/$slug"
            python backtest.py               --ticker "$ticker"               --start "1990-01-01"               --end "2026-09-23"               --stop-mode previous_bar_extreme               --n-mc 1000               --seed 42               --output-dir "results/history_extension/$slug"
          done

      - name: Commit frozen diagnostic artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw results/history_extension
          git commit -m "data: freeze Phase 3 historical coverage diagnostic [skip ci]" || exit 0
          git push
