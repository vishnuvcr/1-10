name: Phase 1 Branch Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-phase1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 1 validation branch
        uses: actions/checkout@v4
        with:
          ref: phase-1-backtest-validation

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Record tested commit
        run: git rev-parse HEAD
